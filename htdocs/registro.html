<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYH - Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/darkly/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#0f0f1e,#1a1a2e,#16213e);display:flex;align-items:center;color:#e0e0e0;font-family:"Segoe UI",system-ui,sans-serif}
    .auth-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .logo{font-size:2.3rem;font-weight:900;background:linear-gradient(90deg,#00ff9d,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .form-control,.form-select{border-radius:12px}
    .btn-success{border-radius:50px;font-weight:700}
    .nav-pills .nav-link{border-radius:50px}
    .nav-pills .nav-link.active{background:#00ff9d;color:#000;font-weight:700}
    .alert{display:none}
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-xl-6">

        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none logo">BYH</a>
          <p class="text-white-50 mt-2">Accede o crea tu cuenta para contactar con profesionales.</p>
        </div>

        <div class="auth-card p-4 p-md-5">

          <ul class="nav nav-pills nav-fill mb-4">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Iniciar sesión</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">Registrarse</button></li>
          </ul>

          <div id="msg" class="alert"></div>

          <div class="tab-content">

            <!-- LOGIN -->
            <div class="tab-pane fade show active" id="loginPane">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input name="email" type="email" class="form-control" required>
                </div>
                <div class="mb-4">
                  <label class="form-label">Contraseña</label>
                  <input name="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-success w-100 py-3" type="submit">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
              </form>
            </div>

            <!-- REGISTER -->
            <div class="tab-pane fade" id="registerPane">
              <form id="registerForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <input name="apellidos" class="form-control" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input name="email" type="email" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label class="form-label">Teléfono</label>
                  <input name="telefono" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label class="form-label">Tipo de usuario</label>
                  <select name="tipo" class="form-select">
                    <option value="cliente">Cliente</option>
                    <option value="profesional">Profesional</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label class="form-label">Contraseña</label>
                  <input name="password" type="password" class="form-control" minlength="4" required>
                </div>

                <button class="btn btn-success w-100 py-3" type="submit">
                  <i class="bi bi-person-plus me-2"></i>Crear cuenta
                </button>
              </form>
            </div>

          </div>

          <div class="text-center mt-4">
            <a href="index.html" class="text-white-50">← Volver al inicio</a>
          </div>

        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
const msg = document.getElementById('msg');

function showMsg(text, type='danger') {
  msg.className = 'alert alert-' + type;
  msg.textContent = text;
  msg.style.display = 'block';
}

function saveAndGo(user) {
  // guardamos sesión en navegador
  localStorage.setItem('currentUser', JSON.stringify(user));

  // IMPORTANTE: ruta absoluta para evitar 404
  window.location.href = '/index.html';
}

async function sendForm(url, form) {
  const res = await fetch('/' + url, {
    method: 'POST',
    body: new FormData(form)
  });
  return await res.json();
}

/* LOGIN */
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  const data = await sendForm('login.php', e.target);

  if (data.success) {
    saveAndGo(data.user);
  } else {
    showMsg(data.error || 'No se pudo iniciar sesión');
  }
});

/* REGISTER */
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();

  const data = await sendForm('registro.php', e.target);

  if (data.success) {
    showMsg('Cuenta creada correctamente. Entrando...', 'success');
    setTimeout(() => saveAndGo(data.user), 600);
  } else {
    showMsg(data.error || 'No se pudo registrar');
  }
});
</script>

</body>
</html>
