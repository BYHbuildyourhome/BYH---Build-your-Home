<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BYH - Chat con Profesional</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/darkly/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #e0e0e0;
      min-height: 100vh;
    }

    .chat-container {
      height: 520px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 75%;
      margin-bottom: 12px;
      padding: 12px 16px;
      border-radius: 18px;
    }

    .message.me {
      background: #00ff9d;
      color: #000;
      align-self: flex-end;
    }

    .message.pro {
      background: #343a40;
      align-self: flex-start;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid px-5">
      <a class="navbar-brand" href="index.html">BYH</a>
      <button onclick="window.location.href='index.html'" class="btn btn-outline-light">
        Volver
      </button>
    </div>
  </nav>

  <div class="container py-5 mt-5">

    <h2 id="pro-nombre" class="fw-bold mb-3"></h2>

    <!-- CHAT -->
    <div class="chat-container" id="chat-box"></div>

    <div class="input-group mt-3">
      <input id="chat-input" class="form-control" placeholder="Escribe mensaje..."
        onkeypress="if(event.key==='Enter') enviarMensaje()">
      <button onclick="enviarMensaje()" class="btn btn-success">Enviar</button>
    </div>

    <!-- COMENTARIOS -->
    <div class="card bg-dark text-white p-4 mt-5">
      <h5>Comentarios</h5>

      <div id="lista-comentarios" class="mb-3"></div>

      <form id="form-comentario">

        <label class="form-label mb-2">Valoración</label>

        <select id="estrellas" class="form-select mb-3" required>
          <option value="1">⭐ 1 estrella</option>
          <option value="2">⭐⭐ 2 estrellas</option>
          <option value="3">⭐⭐⭐ 3 estrellas</option>
          <option value="4">⭐⭐⭐⭐ 4 estrellas</option>
          <option value="5" selected>⭐⭐⭐⭐⭐ 5 estrellas</option>
        </select>

        <div class="input-group">
          <input id="nuevo-comentario" class="form-control" placeholder="Escribe un comentario..." required>
          <button class="btn btn-outline-light">Enviar</button>
        </div>

      </form>
    </div>

  </div>

  <script>
    // ======================
    // USUARIO LOGUEADO
    // ======================
    let user = JSON.parse(localStorage.getItem("currentUser"));

    if (!user) {
      alert("Debes iniciar sesión para comentar");
      window.location.href = "registro.html";
    }

    // ======================
    // PROFESIONAL
    // ======================
    const urlParams = new URLSearchParams(window.location.search);
    const nombrePro = urlParams.get("nombre") || "Profesional";
    document.getElementById("pro-nombre").textContent = nombrePro;

    // De momento fijo, porque tus profesionales de ejemplo no vienen de BD
    const idProfesional = 1;

    // ======================
    // CHAT LOCAL
    // ======================
    let mensajes = [
      { de: "pro", texto: `Hola, soy ${nombrePro}` }
    ];

    let primeraRespuesta = true;

    function renderChat() {
      const box = document.getElementById("chat-box");
      box.innerHTML = "";

      mensajes.forEach(m => {
        const div = document.createElement("div");
        div.className = "message " + (m.de === "yo" ? "me" : "pro");
        div.textContent = m.texto;
        box.appendChild(div);
      });

      box.scrollTop = box.scrollHeight;
    }

    function enviarMensaje() {
      const input = document.getElementById("chat-input");

      if (!input.value.trim()) return;

      mensajes.push({
        de: "yo",
        texto: input.value
      });

      input.value = "";
      renderChat();

      if (primeraRespuesta) {
        setTimeout(() => {
          mensajes.push({
            de: "pro",
            texto: "Enseguida nos pondremos en contacto contigo, por favor espere."
          });
          renderChat();
        }, 1000);

        primeraRespuesta = false;
      }
    }

    // ======================
    // COMENTARIOS
    // ======================
    function cargarComentarios() {
      fetch("obtener_comentarios.php?id_profesional=" + idProfesional)
        .then(res => res.text())
        .then(data => {
          document.getElementById("lista-comentarios").innerHTML = data;
        });
    }

    function borrarComentario(id) {
      if (!confirm("¿Seguro que quieres borrar este comentario?")) return;

      fetch("borrar_comentario.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "id=" + encodeURIComponent(id)
      })
      .then(res => res.text())
      .then(data => {
        if (data.trim() === "OK") {
          cargarComentarios();
        } else {
          alert("Error al borrar");
        }
      });
    }

    document.getElementById("form-comentario").addEventListener("submit", function (e) {
      e.preventDefault();

      let comentario = document.getElementById("nuevo-comentario").value;
      let estrellas = document.getElementById("estrellas").value;

      fetch("guardar_comentario.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body:
          "comentario=" + encodeURIComponent(comentario) +
          "&estrellas=" + encodeURIComponent(estrellas) +
          "&id_profesional=" + encodeURIComponent(idProfesional) +
          "&id_cliente=" + encodeURIComponent(user.id)
      })
      .then(res => res.text())
      .then(data => {
        console.log(data);

        if (data.trim() === "OK") {
          document.getElementById("nuevo-comentario").value = "";
          document.getElementById("estrellas").value = "5";
          cargarComentarios();
        } else {
          alert("Error al guardar comentario: " + data);
        }
      });
    });

    renderChat();
    cargarComentarios();
  </script>

</body>
</html>
