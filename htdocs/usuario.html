<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYH - Mi perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/darkly/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg,#0f0f1e,#1a1a2e,#16213e);
      color: #e0e0e0;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(90deg,#00ff9d,#00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .profile-card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00ff9d;
      background: #222;
    }

    .oficio-box {
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 20px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark fixed-top">
  <div class="container-fluid px-5">
    <a class="navbar-brand logo" href="index.html">BYH</a>
    <button onclick="logout()" class="btn btn-outline-danger">Cerrar sesión</button>
  </div>
</nav>

<div class="container py-5 mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="profile-card p-4 p-md-5">

        <div class="text-center mb-4">
          <img id="avatar" class="avatar mb-3" src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/person-circle.svg" alt="Avatar">
          <h2 id="nombre" class="fw-bold mb-1"></h2>
          <p id="tipo" class="text-success fw-semibold"></p>
        </div>

        <!-- DATOS DEL USUARIO -->
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <div class="p-3 bg-dark rounded">
              <small class="text-white-50">Email</small>
              <div id="email"></div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="p-3 bg-dark rounded">
              <small class="text-white-50">Teléfono</small>
              <div id="telefono"></div>
            </div>
          </div>
        </div>

        <!-- CAMBIAR AVATAR -->
        <form id="avatarForm" class="mb-3">
          <label class="form-label">Cambiar foto de perfil</label>
          <div class="input-group">
            <input type="file" name="avatar" accept="image/*" class="form-control">
            <button class="btn btn-success">Subir</button>
          </div>
        </form>

        <div id="msg" class="small text-white-50 mb-3"></div>

        <!-- ZONA PARA PROFESIONALES -->
        <div id="zona-oficios" style="display:none;" class="mt-4 oficio-box">
          <h4 class="mb-3">
            <i class="bi bi-tools me-2"></i>Crear oficio
          </h4>

          <p class="text-white-50 small">
            Añade los trabajos que puedes realizar para que los clientes puedan encontrarte.
          </p>

          <form id="formOficio">
            <input
              class="form-control mb-2"
              name="titulo"
              placeholder="Ej: Electricista, Fontanero, Pintor..."
              required
            >

            <textarea
              class="form-control mb-2"
              name="descripcion"
              placeholder="Describe qué trabajos realizas"
              rows="3"
              required
            ></textarea>

            <input
              class="form-control mb-2"
              name="precio"
              type="number"
              step="0.01"
              placeholder="Precio orientativo"
            >

            <input
              class="form-control mb-3"
              name="zona"
              placeholder="Zona donde trabajas"
            >

            <button class="btn btn-success w-100">
              Guardar oficio
            </button>
          </form>
        </div>

        <div class="mt-4">
          <a href="index.html" class="btn btn-outline-light w-100">Volver al inicio</a>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem('currentUser'));

if (!user) {
  window.location.href = 'registro.html';
}

function paint(u) {
  document.getElementById('nombre').textContent = `${u.nombre || ''} ${u.apellidos || ''}`.trim();
  document.getElementById('tipo').textContent = u.tipo || 'cliente';
  document.getElementById('email').textContent = u.email || '';
  document.getElementById('telefono').textContent = u.telefono || '';

  if (u.avatar) {
    document.getElementById('avatar').src = u.avatar + '?v=' + Date.now();
  }

  // Mostrar zona de oficios solo si es profesional
  if (u.tipo === "profesional") {
    document.getElementById("zona-oficios").style.display = "block";
  } else {
    document.getElementById("zona-oficios").style.display = "none";
  }
}

paint(user);

fetch('get_user.php?id=' + encodeURIComponent(user.id))
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      user = data.user;
      localStorage.setItem('currentUser', JSON.stringify(user));
      paint(user);
    }
  });

// Subir avatar
document.getElementById('avatarForm').addEventListener('submit', async e => {
  e.preventDefault();

  const fd = new FormData(e.target);
  fd.append('id', user.id);

  const res = await fetch('uploads/upload_avatar.php', {
    method: 'POST',
    body: fd
  });

  const data = await res.json();

  document.getElementById('msg').textContent =
    data.success ? 'Avatar actualizado correctamente.' : (data.error || 'Error al subir avatar');

  if (data.success) {
    user.avatar = data.url;
    localStorage.setItem('currentUser', JSON.stringify(user));
    paint(user);
  }
});

// Guardar oficio
document.getElementById("formOficio")?.addEventListener("submit", async e => {
  e.preventDefault();

  const fd = new FormData(e.target);
  fd.append("id_profesional", user.id);

  const res = await fetch("guardar_oficio.php", {
    method: "POST",
    body: fd
  });

  const data = await res.text();

  if (data.trim() === "OK") {
    alert("Oficio creado correctamente");
    e.target.reset();
  } else {
    alert("Error al crear el oficio");
  }
});

function logout() {
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
}
</script>

</body>
</html>
