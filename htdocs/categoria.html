<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYH - Profesionales</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/darkly/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
        color: #e0e0e0;
      }
      .star {
        color: #ffc107;
      }
      .pro-card {
        transition: all 0.3s;
      }
      .pro-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 255, 157, 0.2);
      }

      /* TEMA CLARO CORREGIDO */
      .light-mode body {
        background: linear-gradient(
          135deg,
          #f0f4f8 0%,
          #d9e4f0 100%
        ) !important;
        color: #1a2638 !important;
      }
      .light-mode .pro-card {
        background: #ffffff !important;
        color: #1a2638 !important;
        border: 1px solid #dee2e6 !important;
      }
      .light-mode .text-white-50 {
        color: #555 !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container-fluid px-5">
        <a class="navbar-brand logo" href="index.html">BYH</a>
        <a href="index.html" class="btn btn-outline-light me-3"
          >← Volver a Inicio</a
        >
        <button
          onclick="toggleTheme()"
          id="theme-toggle"
          class="btn btn-outline-light"
        >
          <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </nav>

    <div class="container py-5 mt-5">
      <h1 class="mb-4" id="categoria-titulo">Profesionales</h1>

      <div class="d-flex flex-wrap gap-3 mb-4">
        <div class="btn-group">
          <button
            class="btn btn-outline-light active"
            onclick="filtrar('puntuacion')"
          >
            ⭐ Mejor puntuados
          </button>
          <button class="btn btn-outline-light" onclick="filtrar('cercania')">
            📍 Más cercanos
          </button>
        </div>
      </div>

      <div
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4"
        id="lista-profesionales"
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Tema
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
        document
          .getElementById("theme-icon")
          .classList.toggle("bi-sun-fill", isLight);
      }
      window.addEventListener("load", () => {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.add("light-mode");
          document.getElementById("theme-icon").classList.add("bi-sun-fill");
        }
      });

      // Abrir perfil
      function verPerfil(nombre) {
        window.location.href = `perfil.html?nombre=${encodeURIComponent(nombre)}`;
      }

      // Datos y funciones originales
      const profesionales = [
        {
          nombre: "Reformas López",
          especialidad: "Albañilería",
          puntuacion: 4.9,
          distancia: 3.2,
          img: "https://images.unsplash.com/photo-1600585154340-be6161a56a9c",
        },
        {
          nombre: "ElectroMax Servicios",
          especialidad: "Electricista",
          puntuacion: 4.8,
          distancia: 5.1,
          img: "https://images.unsplash.com/photo-1581092580490-5e8b0c5f9b0f",
        },
        {
          nombre: "Fontanería García",
          especialidad: "Fontanería",
          puntuacion: 5.0,
          distancia: 2.8,
          img: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7",
        },
        {
          nombre: "Carpintería Ruiz",
          especialidad: "Carpintería en Madera",
          puntuacion: 4.7,
          distancia: 4.5,
          img: "https://images.unsplash.com/photo-1600210492493-094691112201",
        },
      ];

      function generarEstrellas(puntuacion) {
        let html = "";
        const full = Math.floor(puntuacion);
        for (let i = 0; i < 5; i++) {
          html += `<i class="bi ${i < full ? "bi-star-fill" : "bi-star"} star"></i>`;
        }
        return html + ` <span class="text-white-50">(${puntuacion})</span>`;
      }

      function mostrarProfesionales(lista) {
        const contenedor = document.getElementById("lista-profesionales");
        contenedor.innerHTML = "";
        lista.forEach((pro) => {
          const card = `
      <div class="col">
        <div class="pro-card card bg-dark text-white h-100">
          <img src="${pro.img}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${pro.nombre}">
          <div class="card-body">
            <h5 class="card-title">${pro.nombre}</h5>
            <p class="text-success">${pro.especialidad}</p>
            <div class="mb-2">${generarEstrellas(pro.puntuacion)}</div>
            <div class="d-flex align-items-center gap-2 text-white-50 small mb-3">
              <i class="bi bi-geo-alt"></i> ${pro.distancia} km
            </div>
            <button onclick="verPerfil('${pro.nombre}')" class="btn btn-success w-100">Contactar</button>
          </div>
        </div>
      </div>`;
          contenedor.innerHTML += card;
        });
      }

      function filtrar(tipo) {
        let lista = [...profesionales];
        if (tipo === "puntuacion")
          lista.sort((a, b) => b.puntuacion - a.puntuacion);
        else if (tipo === "cercania")
          lista.sort((a, b) => a.distancia - b.distancia);
        mostrarProfesionales(lista);
      }

      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const cat = params.get("cat") || "todas";
        let titulo = "Todos los Profesionales";
        switch (cat) {
          case "albanileria":
            titulo = "Albañilería";
            break;
          case "electricista":
            titulo = "Electricistas";
            break;
          case "fontaneria":
            titulo = "Fontaneros";
            break;
          case "cristaleria":
            titulo = "Cristalería";
            break;
          case "carpinteria-madera":
            titulo = "Carpintería en Madera";
            break;
          case "carpinteria-metalica":
            titulo = "Carpintería Metálica";
            break;
          case "pintura":
            titulo = "Pintura y Decoración";
            break;
          case "reformas":
            titulo = "Reformas Integrales";
            break;
        }
        document.getElementById("categoria-titulo").textContent = titulo;
        mostrarProfesionales(profesionales);
      };
    </script>
  </body>
</html>
