<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYH - Pago Seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/darkly/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      body {
        background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e0e0e0;
      }

      .navbar {
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        z-index: 1030;
      }

      .logo {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -2px;
        background: linear-gradient(90deg, #00ff9d, #00d4ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .payment-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        transition: all 0.4s ease;
      }
      .payment-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 255, 157, 0.2);
        border-color: #00ff9d;
      }

      .method-btn {
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }
      .method-btn.active {
        border-color: #00ff9d;
        background: rgba(0, 255, 157, 0.1);
      }

      .light-mode body {
        background: linear-gradient(135deg, #f0f4f8 0%, #d9e4f0 50%, #c0d4e8 100%) !important;
        color: #1a2638 !important;
      }
      .light-mode .payment-card {
        background: #ffffff !important;
        border-color: #dee2e6 !important;
      }
      .light-mode .method-btn.active {
        border-color: #00b84a;
        background: rgba(0, 184, 74, 0.1);
      }
    </style>
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container-fluid px-5">
        <a class="navbar-brand logo" href="index.html">BYH</a>
        <button onclick="window.location.href='perfil.html'" class="btn btn-outline-light me-3">
  <i class="bi bi-arrow-left"></i> Volver al Perfil
</button>

        <button onclick="toggleTheme()" id="theme-toggle" class="btn btn-outline-light">
          <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </nav>

    <div class="container py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">

          <div class="text-center mb-5">
            <h2 class="fw-bold">Finalizar Contratación</h2>
            <p class="text-success fs-5">Reformas López - Reforma Integral de Cocina</p>
            <h3 class="mt-3 mb-1">150,00 €</h3>
            <p class="text-white-50">IVA incluido • Pago seguro</p>
          </div>

          <!-- Selección de método de pago -->
          <div class="payment-card p-4 mb-4">
            <h5 class="mb-4">Elige tu método de pago</h5>
            <div class="row g-3">
              <div class="col-6 col-md-4">
                <button onclick="selectMethod(this)" class="method-btn btn btn-outline-light w-100 py-3 active" data-method="card">
                  <i class="bi bi-credit-card fs-3 mb-2 d-block"></i>
                  Tarjeta
                </button>
              </div>
              <div class="col-6 col-md-4">
                <button onclick="selectMethod(this)" class="method-btn btn btn-outline-light w-100 py-3" data-method="bizum">
                  <i class="bi bi-phone fs-3 mb-2 d-block"></i>
                  Bizum
                </button>
              </div>
              <div class="col-6 col-md-4">
                <button onclick="selectMethod(this)" class="method-btn btn btn-outline-light w-100 py-3" data-method="transfer">
                  <i class="bi bi-bank fs-3 mb-2 d-block"></i>
                  Transferencia
                </button>
              </div>
            </div>
          </div>

          <!-- Formulario Tarjeta (por defecto visible) -->
          <div id="form-card" class="payment-card p-4">
            <h5 class="mb-4">Datos de la tarjeta</h5>
            <div class="mb-3">
              <label class="form-label">Número de tarjeta</label>
              <input type="text" class="form-control bg-dark border-0 text-white" placeholder="4242 4242 4242 4242" maxlength="19">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de caducidad</label>
                <input type="text" class="form-control bg-dark border-0 text-white" placeholder="MM/AA">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">CVV</label>
                <input type="text" class="form-control bg-dark border-0 text-white" placeholder="123" maxlength="4">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">Nombre del titular</label>
              <input type="text" class="form-control bg-dark border-0 text-white" placeholder="Juan Pérez García">
            </div>
          </div>

          <!-- Formulario Bizum (oculto por defecto) -->
          <div id="form-bizum" class="payment-card p-4" style="display: none;">
            <h5 class="mb-4">Pago con Bizum</h5>
            <div class="mb-3">
              <label class="form-label">Número de teléfono Bizum</label>
              <input type="tel" class="form-control bg-dark border-0 text-white" placeholder="+34 612 345 678">
            </div>
            <p class="text-white-50 small">Recibirás un SMS para confirmar el pago de 150,00 €</p>
          </div>

          <!-- Resumen y botón pagar -->
          <div class="payment-card p-4 mt-4">
            <div class="d-flex justify-content-between mb-3">
              <span>Total a pagar</span>
              <strong class="text-success">150,00 €</strong>
            </div>
            <button onclick="procesarPago()" class="btn btn-success w-100 py-3 fw-bold fs-5 rounded-pill">
              Pagar y Confirmar Contratación
            </button>
            <p class="text-center text-white-50 small mt-3">
              <i class="bi bi-shield-lock"></i> Pago protegido con encriptación SSL
            </p>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
        document.getElementById("theme-icon").classList.toggle("bi-sun-fill", isLight);
      }

      function selectMethod(btn) {
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const method = btn.getAttribute('data-method');
        document.getElementById('form-card').style.display = method === 'card' ? 'block' : 'none';
        document.getElementById('form-bizum').style.display = method === 'bizum' ? 'block' : 'none';
      }

      function procesarPago() {
        if (confirm("¿Confirmas el pago de 150,00 €?")) {
          alert("✅ ¡Pago realizado con éxito!\n\nLa contratación ha sido confirmada.\nRecibirás los detalles por email.");
          // Aquí podrías redirigir a una página de éxito
          // window.location.href = "exito.html";
        }
      }

      // Inicialización
      window.addEventListener("load", () => {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.add("light-mode");
          document.getElementById("theme-icon").classList.add("bi-sun-fill");
        }
      });
    </script>
  </body>
</html>
